<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexStock Measure E2E Fixture</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        background: #ffffff;
      }
      #chart-container {
        width: 900px;
        background: #fff;
      }
    </style>
    <script src="/apexcharts-js/dist/apexcharts.js"></script>
    <script src="/apexstock/dist/apexstock.min.js"></script>
  </head>
  <body>
    <div id="chart-container"><div id="chart"></div></div>

    <script>
      // Deterministic OHLC with a clear decline, so a measurement over it has
      // an unambiguous sign to check after a drag.
      function generateData(count) {
        const data = [];
        const base = Date.UTC(2024, 0, 1);
        let last = 100;
        for (let i = 0; i < count; i++) {
          let n = Math.sin(i * 12.9898) * 43758.5453;
          n = n - Math.floor(n);
          // Up to bar 40, then down to bar 60, then up again.
          const drift = i < 40 ? 0.8 : i < 60 ? -1.6 : 0.9;
          const o = last;
          const c = +(o + drift + (n - 0.5) * 1.2).toFixed(2);
          const h = +(Math.max(o, c) + n).toFixed(2);
          const l = +(Math.min(o, c) - n).toFixed(2);
          data.push({ x: base + i * 86400000, y: [o, h, l, c], v: 1000 + i });
          last = c;
        }
        return data;
      }

      window.__ready = false;
      window.__events = [];
      document.addEventListener("DOMContentLoaded", function () {
        const data = generateData(90);
        const chart = new ApexStock(document.querySelector("#chart"), {
          chart: { height: 420, animations: { enabled: false }, redrawOnParentResize: false },
          theme: { mode: "light" },
          series: [{ name: "AAPL", data: data }],
          analysis: { periodsPerYear: 252, panel: false, measure: { snap: true } },
        });
        chart.render();
        window.__chart = chart;
        window.__data = data;
        chart.on("rangeMeasured", (e) => window.__events.push(e));

        // Measure the decline: bars 40 -> 60.
        chart.measureRange(40, 60);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            window.__ready = true;
          });
        });
      });
    </script>
  </body>
</html>

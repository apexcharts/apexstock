<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexStock - Range and Interval</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f6f8;
        color: #1f2937;
      }
      h1 {
        text-align: center;
        margin: 0 0 4px;
        font-size: 22px;
      }
      p.lead {
        text-align: center;
        color: #667085;
        margin: 0 auto 18px;
        max-width: 820px;
        line-height: 1.5;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
      }
      .group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 10px;
      }
      .group > .label {
        width: 76px;
        flex: none;
        font-size: 12px;
        font-weight: 600;
        color: #344054;
      }
      button {
        border: 1px solid #d0d5dd;
        background: #fff;
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #f8fafc;
      }
      button.active {
        background: #111827;
        color: #fff;
        border-color: #111827;
      }
      input[type="date"] {
        border: 1px solid #d0d5dd;
        border-radius: 7px;
        padding: 5px 8px;
        font-size: 13px;
        font-family: inherit;
      }
      #custom {
        display: none;
        gap: 6px;
        align-items: center;
      }
      #custom.on {
        display: flex;
      }
      .card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(16, 24, 40, 0.08);
        padding: 12px;
        margin: 14px 0;
      }
      #status {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #344054;
        background: #eef1f5;
        border-radius: 7px;
        padding: 8px 10px;
      }
    </style>
    <script src="../../apexcharts-js/dist/apexcharts.js"></script>
    <script src="../dist/apexstock.min.js"></script>
  </head>
  <body>
    <h1>ApexStock &bull; Range and Interval</h1>
    <p class="lead">
      Two independent controls that are easy to conflate. <strong>Range</strong>
      is the window you are looking at, moved with
      <code>setVisibleRange()</code>. <strong>Interval</strong> is how the bars
      are bucketed, rebuilt with <code>ApexStock.aggregateOHLC()</code>. Changing
      one does not change the other.
    </p>

    <div class="wrap">
      <div class="group">
        <span class="label">Range</span>
        <button data-range="5D">5D</button>
        <button data-range="1M">1M</button>
        <button data-range="3M">3M</button>
        <button data-range="6M" class="active">6M</button>
        <button data-range="1Y">1Y</button>
        <button data-range="ALL">All</button>
        <button data-range="custom">Custom</button>
        <span id="custom">
          <input type="date" id="from" />
          <span style="color: #667085; font-size: 13px">to</span>
          <input type="date" id="to" />
          <button id="apply">Apply</button>
        </span>
      </div>

      <div class="group">
        <span class="label">Interval</span>
        <button data-interval="1h">1H</button>
        <button data-interval="4h">4H</button>
        <button data-interval="12h">12H</button>
        <button data-interval="1d" class="active">1D</button>
        <button data-interval="1w">1W</button>
        <button data-interval="1M">1M</button>
      </div>

      <div class="card"><div id="chart"></div></div>
      <div id="status"></div>
    </div>

    <script>
      /**
       * Three years of deterministic hourly candles: the base series every
       * interval is aggregated from. Hourly is the floor here, so 1H is the
       * finest interval on offer; aggregation can only coarsen.
       */
      function generateHourly(hours) {
        const data = [];
        const base = Date.UTC(2022, 0, 3); // a Monday, so 1W buckets line up
        let last = 100;
        for (let i = 0; i < hours; i++) {
          let n = Math.sin(i * 12.9898) * 43758.5453;
          n = n - Math.floor(n);
          const o = last;
          const c = +(o + (n - 0.5) * 1.2).toFixed(2);
          const h = +(Math.max(o, c) + n * 0.8).toFixed(2);
          const l = +(Math.min(o, c) - n * 0.8).toFixed(2);
          data.push({
            x: base + i * 3600000,
            y: [o, h, l, c],
            v: Math.floor(n * 1e6),
          });
          last = c;
        }
        return data;
      }

      const DAY = 86400000;
      const RANGES = {
        "5D": 5 * DAY,
        "1M": 30 * DAY,
        "3M": 91 * DAY,
        "6M": 182 * DAY,
        "1Y": 365 * DAY,
      };

      const base = generateHourly(24 * 365 * 3); // 26,280 hourly candles
      const firstX = base[0].x;
      const lastX = base[base.length - 1].x;

      let interval = "1d";
      let range = "6M";

      const chart = new ApexStock(document.querySelector("#chart"), {
        chart: { height: 460, animations: { enabled: false } },
        theme: { mode: "light" },
        series: [{ name: "AAPL", data: ApexStock.aggregateOHLC(base, interval) }],
      });
      chart.render();
      window.__chart = chart;
      window.__base = base;

      const iso = (ts) => new Date(ts).toISOString().slice(0, 10);
      document.getElementById("from").value = iso(lastX - RANGES["6M"]);
      document.getElementById("to").value = iso(lastX);

      /** Apply the named range to the chart's visible window. */
      function applyRange(name) {
        range = name;
        if (name === "ALL") {
          chart.setVisibleRange(firstX, lastX);
        } else if (name === "custom") {
          const from = Date.parse(document.getElementById("from").value);
          const to = Date.parse(document.getElementById("to").value);
          if (Number.isFinite(from) && Number.isFinite(to) && from < to) {
            chart.setVisibleRange(from, to);
          }
        } else {
          chart.setVisibleRange(Math.max(firstX, lastX - RANGES[name]), lastX);
        }
        sync();
      }

      /** Re-bucket the base series, then put the window back where it was. */
      function applyInterval(name) {
        interval = name;
        chart.update({
          series: [{ name: "AAPL", data: ApexStock.aggregateOHLC(base, name) }],
        });
        // New data resets the view to the full extent, so the range the user
        // picked has to be re-asserted. This is the bit worth copying: the two
        // controls are independent, but only if you keep them that way.
        applyRange(range);
      }

      document.querySelectorAll("[data-range]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .getElementById("custom")
            .classList.toggle("on", btn.dataset.range === "custom");
          applyRange(btn.dataset.range);
        });
      });
      document.getElementById("apply").addEventListener("click", () => {
        applyRange("custom");
      });
      document.querySelectorAll("[data-interval]").forEach((btn) => {
        btn.addEventListener("click", () => applyInterval(btn.dataset.interval));
      });

      /** Reflect what each control is actually doing. */
      function sync() {
        document
          .querySelectorAll("[data-range]")
          .forEach((b) => b.classList.toggle("active", b.dataset.range === range));
        document
          .querySelectorAll("[data-interval]")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.interval === interval)
          );

        const bars = chart.series.length;
        const view = chart.getVisibleRange();
        const inView = view
          ? chart.series.filter((d) => d.x >= view.min && d.x <= view.max).length
          : bars;

        document.getElementById("status").textContent =
          `interval ${interval}: ${bars.toLocaleString()} bars aggregated from ` +
          `${base.length.toLocaleString()} hourly` +
          (view
            ? `   |   range ${range}: ${iso(view.min)} to ${iso(view.max)}, ` +
              `${inView.toLocaleString()} bars in view`
            : "");
      }

      applyRange(range);
    </script>
  </body>
</html>

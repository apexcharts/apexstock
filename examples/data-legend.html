<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexStock - Data Legend</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f6f8;
        color: #1f2937;
      }
      h1 { text-align: center; margin: 0 0 4px; }
      p.lead { text-align: center; color: #667085; margin: 0 auto 16px; max-width: 780px; }
      .wrap { max-width: 1040px; margin: 0 auto; }
      .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(16,24,40,0.08); padding: 12px; margin-bottom: 14px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      button { padding: 7px 12px; border: 1px solid #d0d5dd; border-radius: 7px; background: #fff; cursor: pointer; font-size: 13px; }
      button:hover { background: #f8fafc; }
    </style>
    <script src="../../apexcharts-js/dist/apexcharts.js"></script>
    <script src="../dist/apexstock.min.js"></script>
  </head>
  <body>
    <h1>ApexStock &bull; Data Legend</h1>
    <p class="lead">
      A corner panel that reads out the instrument's OHLC, change, and volume at
      the crosshair (falling back to the latest bar), plus each overlay
      indicator's value. Move your pointer across the chart to see it track.
    </p>

    <div class="wrap">
      <div class="row">
        <button id="toggle">Hide legend</button>
        <button id="cycle">Move to next corner</button>
        <span id="status" style="color:#667085;font-size:13px">shown (top-left)</span>
      </div>
      <div class="card"><div id="chart"></div></div>
    </div>

    <script>
      function generateData(count) {
        const data = [];
        const base = Date.UTC(2024, 0, 1);
        let last = 100;
        for (let i = 0; i < count; i++) {
          let n = Math.sin((i + 1) * 12.9898) * 43758.5453;
          n = n - Math.floor(n);
          const o = last;
          const c = +(o + (n - 0.5) * 4).toFixed(2);
          const h = +(Math.max(o, c) + n * 2).toFixed(2);
          const l = +(Math.min(o, c) - n * 2).toFixed(2);
          data.push({ x: base + i * 86400000, y: [o, h, l, c], v: Math.floor(n * 1e6) });
          last = c;
        }
        return data;
      }

      const chart = new ApexStock(document.querySelector("#chart"), {
        chart: { height: 440, animations: { enabled: false } },
        theme: { mode: "light" },
        series: [{ name: "AAPL", data: generateData(180) }],
        legend: { show: true, position: "top-left" },
      });
      chart.render();
      // Overlays whose values show up as legend rows.
      chart.updateIndicator("moving average");
      chart.updateIndicator("exponential moving average");

      const status = document.getElementById("status");
      const toggle = document.getElementById("toggle");
      toggle.addEventListener("click", () => {
        const shown = chart.toggleLegend();
        toggle.textContent = shown ? "Hide legend" : "Show legend";
        status.textContent = shown ? "shown" : "hidden";
      });

      const corners = ["top-left", "top-right", "bottom-right", "bottom-left"];
      let ci = 0;
      document.getElementById("cycle").addEventListener("click", () => {
        ci = (ci + 1) % corners.length;
        chart.showLegend({ position: corners[ci] });
        toggle.textContent = "Hide legend";
        status.textContent = "shown (" + corners[ci] + ")";
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexStock - Theme Presets</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f6f8;
        color: #1f2937;
      }
      h1 { text-align: center; margin: 0 0 4px; }
      p.lead { text-align: center; color: #667085; margin: 0 auto 16px; max-width: 820px; }
      .wrap { max-width: 1040px; margin: 0 auto; }
      .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(16,24,40,0.08); padding: 12px; margin-bottom: 14px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      button { padding: 7px 12px; border: 1px solid #d0d5dd; border-radius: 7px; background: #fff; cursor: pointer; font-size: 13px; }
      button:hover { background: #f8fafc; }
      button.active { background: #111827; color: #fff; border-color: #111827; }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
      #status { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #344054; }
    </style>
    <script src="../../apexcharts-js/dist/apexcharts.js"></script>
    <script src="../dist/apexstock.min.js"></script>
  </head>
  <body>
    <h1>ApexStock &bull; Theme Presets</h1>
    <p class="lead">
      A curated, light-first pack of named themes via <code>setThemePreset(name)</code>
      (or <code>theme: { preset }</code>). Each preset re-tints the candles,
      grid, background, and accent; register your own with
      <code>ApexStock.registerTheme(name, def)</code>.
    </p>

    <div class="wrap">
      <div class="row" id="presets"></div>
      <div class="card"><div id="chart"></div></div>
    </div>

    <script>
      function generateData(count) {
        const data = [];
        const base = Date.UTC(2023, 0, 1);
        let last = 100;
        for (let i = 0; i < count; i++) {
          let n = Math.sin((i + 1) * 12.9898) * 43758.5453;
          n = n - Math.floor(n);
          const o = last;
          const c = +(o + (n - 0.5) * 5).toFixed(2);
          const h = +(Math.max(o, c) + n * 2.5).toFixed(2);
          const l = +(Math.min(o, c) - n * 2.5).toFixed(2);
          data.push({ x: base + i * 86400000, y: [o, h, l, c], v: Math.floor(n * 1e6) });
          last = c;
        }
        return data;
      }

      const chart = new ApexStock(document.querySelector("#chart"), {
        chart: { height: 460, animations: { enabled: false } },
        theme: { preset: "paper" },
        series: [{ name: "AAPL", data: generateData(160) }],
        legend: { show: true, position: "top-left" },
      });
      chart.render();
      chart.updateIndicator("moving average");

      // One button per registered preset.
      const bar = document.getElementById("presets");
      const buttons = {};
      ApexStock.getThemePresets().forEach((name) => {
        const btn = document.createElement("button");
        btn.textContent = name;
        btn.dataset.preset = name;
        if (name === "paper") btn.classList.add("active");
        btn.addEventListener("click", () => {
          chart.setThemePreset(name);
          Object.values(buttons).forEach((b) =>
            b.classList.toggle("active", b === btn)
          );
        });
        buttons[name] = btn;
        bar.appendChild(btn);
      });

      // Also show a plain dark toggle to prove presets clear back to a mode.
      const dark = document.createElement("button");
      dark.textContent = "plain dark";
      dark.addEventListener("click", () => {
        chart.updateTheme("dark");
        Object.values(buttons).forEach((b) => b.classList.remove("active"));
      });
      bar.appendChild(dark);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexStock - Toolbar Customization</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f6f8;
        color: #1f2937;
      }
      h1 { text-align: center; margin: 0 0 4px; }
      p.lead { text-align: center; color: #667085; margin: 0 auto 16px; max-width: 820px; }
      .wrap { max-width: 1040px; margin: 0 auto; }
      .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(16,24,40,0.08); padding: 12px; margin-bottom: 14px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      button { padding: 7px 12px; border: 1px solid #d0d5dd; border-radius: 7px; background: #fff; cursor: pointer; font-size: 13px; }
      button:hover { background: #f8fafc; }
      #status { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #344054; }
    </style>
    <script src="../node_modules/apexcharts/dist/apexcharts.js"></script>
    <script src="../dist/apexstock.min.js"></script>
  </head>
  <body>
    <h1>ApexStock &bull; Toolbar Customization</h1>
    <p class="lead">
      Hide built-in toolbar sections and inject your own controls, from the
      <code>toolbar</code> option or the <code>addToolbarItem</code> /
      <code>removeToolbarItem</code> runtime API.
    </p>

    <div class="wrap">
      <div class="row">
        <button id="add">addToolbarItem("reset")</button>
        <button id="remove">removeToolbarItem("reset")</button>
        <button id="hideDl">toggle download</button>
        <span id="status">Two custom controls were injected from config.</span>
      </div>
      <div class="card"><div id="chart"></div></div>
    </div>

    <script>
      function generateData(count) {
        const data = [];
        const base = Date.UTC(2024, 0, 1);
        let last = 100;
        for (let i = 0; i < count; i++) {
          let n = Math.sin((i + 1) * 12.9898) * 43758.5453;
          n = n - Math.floor(n);
          const o = last;
          const c = +(o + (n - 0.5) * 4).toFixed(2);
          const h = +(Math.max(o, c) + n * 2).toFixed(2);
          const l = +(Math.min(o, c) - n * 2).toFixed(2);
          data.push({ x: base + i * 86400000, y: [o, h, l, c], v: Math.floor(n * 1e6) });
          last = c;
        }
        return data;
      }

      const camera =
        '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';

      const status = document.getElementById("status");

      const chart = new ApexStock(document.querySelector("#chart"), {
        chart: { height: 440, animations: { enabled: false } },
        theme: { mode: "light" },
        series: [{ name: "AAPL", data: generateData(160) }],
        toolbar: {
          custom: [
            {
              id: "snapshot",
              title: "Download PNG",
              icon: camera,
              position: "right",
              order: 0,
              onClick: (c) => c.export({ format: "png", download: true }),
            },
            {
              id: "log",
              title: "Toggle log scale",
              position: "left-start",
              onClick: (c) => {
                const next = c.getPriceScale().mode === "logarithmic" ? "linear" : "logarithmic";
                c.setPriceScale(next);
                status.textContent = "price scale: " + next;
              },
            },
          ],
        },
      });
      chart.render();

      document.getElementById("add").addEventListener("click", () => {
        chart.addToolbarItem({
          id: "reset",
          title: "Reset zoom",
          position: "right",
          order: 5,
          onClick: (c) => c.resetZoom && c.resetZoom(),
        });
        status.textContent = "items: " + chart.getToolbarItems().map((i) => i.id).join(", ");
      });
      document.getElementById("remove").addEventListener("click", () => {
        chart.removeToolbarItem("reset");
        status.textContent = "items: " + chart.getToolbarItems().map((i) => i.id).join(", ");
      });
      let dl = true;
      document.getElementById("hideDl").addEventListener("click", () => {
        dl = !dl;
        // Re-run the built-in section visibility by toggling the config + reapply.
        chart.chartOptions.toolbar.items = { download: dl ? true : false };
        chart.toolbar.reapply();
        status.textContent = "download button " + (dl ? "shown" : "hidden");
      });
    </script>
  </body>
</html>
